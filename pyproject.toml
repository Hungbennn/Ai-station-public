[project]
name = "ben-station"
version = "0.1.0"
description = "ben-station: trạm điều phối, chấm cột beads"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.13,<2",
  "fastapi==0.143.0",
  "lancedb==0.40.0",
  "mcp==1.30.0",
  "pydantic>=2.14,<3",
  "pyyaml>=6.0.3,<7",
  "uvicorn==0.54.0",
  "webauthn==3.0.1",
]

[project.scripts]
tram = "tram.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
